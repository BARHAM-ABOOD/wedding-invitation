<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة زفاف عبد الرحمن وفاتنة</title>
<meta name="description" content="حرم الحاج عبدالله فتحي برهم وحرم السيد يحيى ابراهيم صلاح يتشرفن بدعوتكن لحضور حفل الزفاف · الأحد ٣ يناير ٢٠٢٧ · من ٦:٠٠ حتى ٨:٠٠ مساءً · قاعة ديلايت في عصيرة الشمالية - نابلس">
<meta name="theme-color" content="#5E1120">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<meta property="og:title" content="دعوة زفاف عبد الرحمن وفاتنة">
<meta property="og:description" content="الأحد ٣ يناير ٢٠٢٧ · من ٦:٠٠ حتى ٨:٠٠ مساءً · قاعة ديلايت في عصيرة الشمالية - نابلس. افتح دعوتك.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23B0904F'/%3E%3Cpath d='M32 14 L50 32 L32 50 L14 32Z' fill='none' stroke='%23FBF8F2' stroke-width='3'/%3E%3C/svg%3E">
<!-- استدعاء خطوط Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3EDE1}
a{color:#7A5F30}a:hover{color:#5C4622}
*{box-sizing:border-box}

.page{min-height:100vh;background:#F3EDE1;color:#2B2925;font-family:'Tajawal', sans-serif;direction:rtl;-webkit-font-smoothing:antialiased; overflow-x: hidden;}

/* الآية على سطر واحد كاملة بدون أي خط رمادي، مع تصغير حجم الخط لمنع خروج الأقواس */
.verse{font-family:'Amiri', serif !important; line-height: 2 !important; font-size: clamp(11px, 2.1vw, 15px) !important; color:#4A4438; margin: 18px auto 0; max-width: 100%; white-space: nowrap; overflow-x: auto; padding: 0 4px; border: none !important; box-shadow: none !important; background: transparent !important;}

.intro{position:fixed;inset:0;z-index:50;background:#F3EDE1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:16px;transition:opacity .9s ease, visibility .9s ease}
.intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.intro-head{display:flex; flex-direction:column; align-items:center; gap:6px;}
.intro-kicker{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size:clamp(16px, 3vw, 22px); color:#6E5730; margin:0; text-align:center; line-height:1.6;}
.intro-title{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size:clamp(24px, 4.2vw, 34px); color:#2B2925; margin:0; text-align:center; line-height:1.5}
.env{position:relative;width:min(90vw, 420px);aspect-ratio:3/2;perspective:1400px;cursor:pointer}
.env-back{position:absolute;inset:0;background:#5E1120;border-radius:6px;box-shadow:0 30px 60px -28px rgba(94,17,32,.5),0 10px 22px -12px rgba(0,0,0,.25)}
.env-card{position:absolute;left:5%;right:5%;top:5%;bottom:5%;background:#FBF8F2;border-radius:3px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:6px;transition:transform 1.1s cubic-bezier(.2,.7,.2,1) .7s;box-shadow:inset 0 0 0 4px #FBF8F2,inset 0 0 0 5px #CDB689; text-align: center;}
.env-card-names{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size: clamp(14px, 2.8vw, 18px); color:#7A5F30; line-height:1.6; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0 14px;}
.env-front{position:absolute;inset:0;z-index:3;border-radius:6px;overflow:hidden;pointer-events:none}
.env-front-fill{position:absolute;inset:0;background:#6B1626;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-front svg{position:absolute;inset:0;width:100%;height:100%}
.env-flap{position:absolute;top:0;left:0;right:0;height:64%;z-index:4;transform-origin:top center;transition:transform 1s cubic-bezier(.5,0,.2,1),z-index 0s linear .5s}
.env-flap-fill{position:absolute;inset:0;background:#4E0D1A;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.env-flap svg{position:absolute;inset:0;width:100%;height:100%}
.env-seal{position:absolute;left:50%;top:64%;width:70px;height:70px;margin:-35px 0 0 -35px;z-index:5;border-radius:50%;background:#B0904F;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(176,144,79,.28),0 6px 14px -4px rgba(0,0,0,.4);transition:transform .5s ease,opacity .5s ease}
.env-seal-inner{width:56px;height:56px;border-radius:50%;border:1px solid rgba(251,248,242,.55);display:flex;align-items:center;justify-content:center;color:#FBF8F2}

/* حركات فتح المغلف */
.env.is-opening .env-seal{transform:scale(.6);opacity:0}
.env.is-opening .env-flap{transform:rotateX(180deg);z-index:1}
.env.is-opening .env-card{transform:translateY(-52%)}

.open-btn{min-height:48px;padding:0 32px;border-radius:999px;border:1px solid #5E1120;background:#5E1120;color:#FBF8F2;font-size:15px;font-weight: 500;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:background .3s,transform .3s;z-index:10;font-family:'Tajawal', sans-serif;}
.open-btn:hover{background:#76192B;transform:translateY(-1px)}
.open-btn:focus-visible,.btn:focus-visible{outline:2px solid #B0904F;outline-offset:3px}

.main{max-width:640px;margin:0 auto;padding:clamp(16px, 4vw, 40px) 12px 80px;display:flex;flex-direction:column;gap:clamp(20px, 4vw, 36px)}
.card{position:relative;background:#FBF8F2;padding:clamp(40px, 8vw, 75px) clamp(16px, 5vw, 50px);text-align:center;box-shadow:inset 0 0 0 8px #FBF8F2,inset 0 0 0 9px #CDB689,inset 0 0 0 13px #FBF8F2,inset 0 0 0 14px #E3D5B6,0 30px 60px -40px rgba(60,45,20,.3)}
.corner{position:absolute;width:52px;height:52px;color:#B0904F}
.corner.tr{top:14px;right:14px}
.corner.tl{top:14px;left:14px;transform:scaleX(-1)}
.corner.br{bottom:14px;right:14px;transform:scaleY(-1)}
.corner.bl{bottom:14px;left:14px;transform:scale(-1,-1)}

.bismillah{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size:clamp(16px, 3vw, 20px);color:#6E5730;margin:0;}
.verse-ref{display:block;font-size:12px;color:#7A6E58;margin-top:6px;font-family:'Tajawal', sans-serif;}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px auto;color:#B0904F}
.divider span{display:block;height:1px;width:clamp(36px, 12vw, 80px);background:#CDB689}

.hosts-container{margin:18px 0 14px;}
.hosts-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:nowrap;}
.host{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center; padding: 0 4px;}
.host-name{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size:clamp(11px, 2.5vw, 14px);color:#7A5F30;white-space:nowrap; line-height: 1.8;}
.host-role{font-size:10px;color:#6E5730;font-family:'Tajawal', sans-serif;}
.hosts-and{font-size:14px;color:#B0904F;font-weight:700;align-self:center;}
.hosts-lead{font-size:clamp(14px, 2.8vw, 17px);color:#3A3630;margin:12px 0 0;line-height:1.6;font-weight:500;}

/* ضبط اسم عبدالرحمن بشكل دقيق ومنح مساحة أمان أفقية كافية لمنع أي قص للحروف */
.names{font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; margin:36px 0 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;line-height:1.7; width:100%;}
.name{font-size:clamp(22px, 5.2vw, 34px);background:linear-gradient(100deg,#7E6130 0%,#A9884C 38%,#E2CD9C 50%,#A9884C 62%,#7E6130 100%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s ease-in-out infinite;padding:0 1.2em; text-align: center; width: 100%; font-weight:700; font-style:normal; display:inline-block; overflow:visible;}
.amp{font-size: clamp(16px, 3.2vw, 20px); color:#B0904F; display: inline-flex; align-items: center; justify-content: center; margin: 4px 0;}

.blessing{font-size:clamp(14px, 2.8vw, 17px);line-height:1.8;color:#4A4438;margin:22px auto 0;max-width:28em;font-weight: 400;}
.date-strip{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.date-strip .seg{font-size:clamp(13px, 2.6vw, 16px);color:#3A3630;font-weight:500;}
.date-strip .dot{width:4px;height:4px;background:#B0904F;transform:rotate(45deg)}

.section{background:#FBF8F2;padding:clamp(28px, 5vw, 44px) clamp(16px, 4vw, 36px);text-align:center;box-shadow:inset 0 0 0 1px #E3D5B6}
.section-title{font-family:'Tajawal', sans-serif;font-weight:700;font-size:clamp(22px, 4vw, 28px);color:#2B2925;margin:0}
.section-sub{font-size:14px;color:#6E5730;margin:6px 0 0;font-weight: 500;}

.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px;direction:rtl}
.unit{border:1px solid #CDB689;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FDFBF7}
.unit-num{font-family:'Tajawal', sans-serif;font-weight:700;font-size:clamp(22px, 5.5vw, 36px);line-height:1;color:#5E1120;font-variant-numeric:tabular-nums}
.unit-label{font-size:13px;color:#6E5730;font-weight: 500;}
.celebrate{margin-top:20px;font-family:'Noto Nastaliq Urdu', serif; font-weight:700; font-style:normal; font-size:clamp(20px, 4vw, 30px);color:#7A5F30;line-height:1.6}

.details{display:flex;flex-direction:column;gap:0;margin-top:20px;text-align:right}
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #EAE0C9}
.row:last-child{border-bottom:0}
.row-ic{flex:0 0 36px;height:36px;border-radius:50%;border:1px solid #CDB689;display:flex;align-items:center;justify-content:center;color:#7A5F30}
.row-k{font-size:13px;color:#6E5730;font-weight: 500;}
.row-v{font-size:15px;color:#2B2925;margin-top:2px;line-height:1.5;font-weight:500; word-break: break-word;}

.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{min-height:46px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .25s,color .25s,transform .25s;border:1px solid #5E1120; text-align: center;font-family:'Tajawal', sans-serif;}
.btn.solid{background:#5E1120;color:#FBF8F2}
.btn.solid:hover{background:#76192B;color:#FBF8F2;transform:translateY(-1px)}
.btn.line{background:transparent;color:#5E1120}
.btn.line:hover{background:#5E1120;color:#FBF8F2}

/* أنماط قسم تأكيد الحضور (RSVP) وتعطيل العداد تماماً عند الاختيار */
.rsvp-card{background:#FBF8F2;border:1px solid #E3D5B6;padding:clamp(28px, 5vw, 44px) clamp(16px, 4vw, 36px);text-align:center;box-shadow:inset 0 0 0 1px #E3D5B6}
.rsvp-card h3{font-family:'Tajawal',sans-serif;color:#2B2925;font-size:clamp(20px, 3.8vw, 26px);margin-bottom:6px;font-weight:700}
.rsvp-card p{color:#6E5730;font-size:14px;margin-bottom:16px}
.field{margin-bottom:12px;text-align:right}
.field input{width:100%;font-family:'Tajawal',sans-serif;font-size:15px;padding:12px 14px;border:1px solid #CDB689;border-radius:4px;background:#FDFBF7;color:#2B2925;outline:none}
.field input:focus{border-color:#7A5F30}
.choice{display:flex;gap:10px;margin-bottom:14px}
.choice label{flex:1;cursor:pointer}
.choice input{display:none}
.choice span{display:block;padding:11px 6px;border:1px solid #CDB689;border-radius:4px;font-family:'Tajawal',sans-serif;font-size:14px;color:#2B2925;background:#FDFBF7;transition:.2s;text-align:center}
.choice input:checked + span{background:#5E1120;color:#FBF8F2;border-color:#5E1120}
.counter-box{transition:opacity .3s ease, max-height .3s ease, margin .3s ease; overflow:hidden;}
.counter-box.disabled{opacity:0.2; pointer-events:none; filter: grayscale(100%);}
.counter{display:flex;align-items:center;justify-content:space-between;border:1px solid #CDB689;border-radius:4px;background:#FDFBF7;padding:8px 12px;margin-bottom:14px;}
.counter label{font-family:'Tajawal',sans-serif;font-size:14px;color:#2B2925}
.counter .ctl{display:flex;align-items:center;gap:12px}
.counter button{width:32px;height:32px;border-radius:50%;border:1px solid #CDB689;background:transparent;color:#5E1120;font-size:18px;cursor:pointer}
.counter output{min-width:20px;font-size:18px;color:#5E1120}
.thanks{display:none;font-size:15px;color:#5E1120;margin-top:10px;font-weight:500}

.closing{text-align:center;padding:6px 6px 0}
.closing p{font-size:clamp(16px, 3.2vw, 20px);line-height:1.8;color:#3A3630;margin:0}
.closing .dua{color:#7A5F30;margin-bottom:18px}
.mono{display:flex;justify-content:center;margin-top:16px}
.mono svg{height:84px;width:auto;display:block}

.env-seal-inner svg{height:32px;width:auto;display:block}

.reveal{opacity:0;transform:translateY(16px);animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.15s}.d3{animation-delay:.45s}.d4{animation-delay:.75s}.d6{animation-delay:1.3s}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes shimmer{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@media (max-width:420px){.count{grid-template-columns:repeat(2,minmax(0,1fr))}.corner{width:46px;height:46px}}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- عنصر الصوت المحلي -->
<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="page">

<div class="intro" id="intro">
  <div class="intro-head">
    <p class="intro-kicker">إلى ضيفنا الكريم</p>
    <h1 class="intro-title">دعوة زفاف</h1>
  </div>
  <div class="env" id="env" aria-hidden="true">
    <div class="env-back"></div>
    <div class="env-card">
      <div class="env-card-names">
        <span>عبدالرحمن</span>
        <span style="color:#B0904F; font-size:12px;">♥</span>
        <span>فاتنة</span>
      </div>
    </div>
    <div class="env-front">
      <div class="env-front-fill"></div>
      <svg viewBox="0 0 300 200" preserveAspectRatio="none" fill="none" stroke="#B0904F" stroke-width="0.6" opacity="0.7"><path d="M0 0 L150 112 L300 0"></path><path d="M6 40 V194 H294 V40" opacity="0.6"></path></svg>
    </div>
    <div class="env-flap">
      <div class="env-flap-fill"></div>
      <svg viewBox="0 0 300 128" preserveAspectRatio="none" fill="none" stroke="#B0904F" stroke-width="0.6" opacity="0.8"><path d="M8 4 L150 118 L292 4"></path></svg>
    </div>
    <div class="env-seal" id="seal"><div class="env-seal-inner"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart-icon"></use></svg></div></div>
